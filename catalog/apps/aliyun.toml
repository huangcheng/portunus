slug = "aliyun"
label = "阿里云"
description = "Alibaba Cloud OpenAPI MCP (Core Streamable HTTP) via Custom OAuth. Paste Core URL + RAM OAuth Client ID (Aliyun DCR ignores custom redirects; OAuth 2.1 apps have no secret)."
connection = "oauth"
egress = "domestic"
popular = true
categories = ["Developer Tools"]
tags = ["aliyun", "alibaba", "oauth", "mcp", "openapi"]
sort_order = 17

[spec]
url_from_operator = true
authorize_url = "https://signin.aliyun.com/oauth2/v1/auth"
token_url = "https://oauth.aliyun.com/v1/token"
# Aliyun /register always returns the official client_id and does NOT bind custom
# redirect_uris — Portunus public callback gets redirect_uri_mismatch. Use Custom OAuth.
# OAuth 2.1 Web/Native apps are public clients (PKCE, no client_secret).
token_endpoint_auth_method = "none"
resource = "https://openapi-mcp.cn-hangzhou.aliyuncs.com"
# No issuer: Aliyun omits RFC 9207 iss on the authorize redirect.
scopes = ["openid", "/acs/mcp-server"]
setup_hints = [
  "1) RAM → OAuth 企业应用: OAuth 2.1 Web/Native, callback ``https://portunus.wuhan.dev/api/oauth/callback``, scope ``/acs/mcp-server`` (no secret — PKCE). 2) [api.aliyun.com/mcp](https://api.aliyun.com/mcp) Core → 自定义 OAuth → that app; copy Streamable HTTP URL. 3) Connect: paste URL + Client ID, Authorize.",
]
