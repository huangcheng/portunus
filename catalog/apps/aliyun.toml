slug = "aliyun"
label = "阿里云"
description = "Alibaba Cloud OpenAPI MCP via local mcp-proxy — paste AccessKey ID and Secret at Connect (no OAuth)."
connection = "stdio"
egress = "domestic"
popular = true
categories = ["Developer Tools"]
tags = ["aliyun", "alibaba", "stdio", "mcp", "openapi"]
sort_order = 17

[spec]
command = "uvx"
args = ["alibabacloud.mcp-proxy==0.2.17"]
setup_hints = [
  "Create an AccessKey for a RAM user with AliyunOpenAPIMCPServerStaticCredentialAccess (or ram:GenerateAccessToken + openapiexplorer:*). Docs: [alibabacloud-api-mcp-server](https://github.com/aliyun/alibabacloud-api-mcp-server).",
]

[[spec.env]]
name = "ALIBABA_CLOUD_ACCESS_KEY_ID"
label = "AccessKey ID"
secret = true

[[spec.env]]
name = "ALIBABA_CLOUD_ACCESS_KEY_SECRET"
label = "AccessKey Secret"
secret = true
