slug = "aliyun"
label = "阿里云"
description = "Alibaba Cloud OpenAPI MCP via local mcp-proxy + AccessKey. Optional Core Streamable HTTP URL."
connection = "stdio"
egress = "domestic"
popular = true
categories = ["Developer Tools"]
tags = ["aliyun", "alibaba", "stdio", "mcp", "openapi", "accesskey"]
sort_order = 17

[spec]
command = "uvx"
args = ["alibabacloud.mcp-proxy==0.2.17"]
setup_hints = [
  "Create a RAM user AccessKey with `AliyunOpenAPIMCPServerStaticCredentialAccess`. Paste AK ID/Secret. Optionally set MCP Server URL to your Core Streamable HTTP from [api.aliyun.com/mcp](https://api.aliyun.com/mcp) (blank = auto-discover). First-time accounts may need Aliyun’s static-credential pre-check.",
]

[[spec.env]]
name = "ALIBABA_CLOUD_ACCESS_KEY_ID"
label = "AccessKey ID"
secret = true

[[spec.env]]
name = "ALIBABA_CLOUD_ACCESS_KEY_SECRET"
label = "AccessKey Secret"
secret = true

[[spec.env]]
name = "ALIBABACLOUD_MCP_SERVER_URL"
label = "MCP Server URL (optional Core Streamable HTTP)"
secret = false
