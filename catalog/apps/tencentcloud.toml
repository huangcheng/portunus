slug = "tencentcloud"
label = "腾讯云"
description = "Tencent Cloud CVM management MCP (instances, VPC, security groups, monitoring) via SecretId/SecretKey."
connection = "stdio"
egress = "domestic"
popular = true
categories = ["Developer Tools"]
tags = ["tencentcloud", "cvm", "stdio", "mcp"]
sort_order = 12

[spec]
command = "uvx"
args = ["mcp-server-cvm==0.1.12"]
setup_hints = [
  "Create API keys in [CAM → API Keys](https://console.cloud.tencent.com/cam/capi). Package: [mcp-server-cvm](https://github.com/TencentCloudCommunity/mcp-server/tree/main/src/mcp-server-cvm). Default region is ap-guangzhou (override via TENCENTCLOUD_REGION after Connect if needed).",
]

[[spec.env]]
name = "TENCENTCLOUD_SECRET_ID"
label = "SecretId"
secret = true

[[spec.env]]
name = "TENCENTCLOUD_SECRET_KEY"
label = "SecretKey"
secret = true

[spec.env_defaults]
TENCENTCLOUD_REGION = "ap-guangzhou"
