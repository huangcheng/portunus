slug = "dropbox"
label = "Dropbox"
description = "Files, sharing, and file requests via Dropbox MCP."
connection = "oauth"
popular = true
categories = ["Storage"]
tags = ["oauth", "files", "storage"]
sort_order = 20

[spec]
url = "https://mcp.dropbox.com/mcp"
# token_access_type=offline is required for Dropbox to return a refresh_token.
authorize_url = "https://www.dropbox.com/oauth2/authorize?token_access_type=offline"
token_url = "https://api.dropboxapi.com/oauth2/token"
# Confidential app: refresh grant needs the app secret (vaulted at Connect).
token_endpoint_auth_method = "client_secret_basic"
scopes = [
  "account_info.read",
  "files.metadata.read",
  "files.content.read",
  "files.content.write",
  "sharing.read",
  "sharing.write",
  "file_requests.read",
  "file_requests.write",
]
