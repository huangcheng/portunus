slug = "vercel"
label = "Vercel"
description = "Vercel official remote MCP (projects, deployments, docs, analytics) via OAuth."
connection = "oauth"
egress = "overseas"
popular = true
categories = ["Developer Tools"]
tags = ["vercel", "oauth", "mcp", "deploy"]
sort_order = 19

[spec]
url = "https://mcp.vercel.com/"
authorize_url = "https://vercel.com/oauth/authorize"
token_url = "https://vercel.com/api/login/oauth/token"
# Vercel rejects unapproved DCR redirect URIs; use Client ID Metadata Document.
use_cimd = true
token_endpoint_auth_method = "none"
resource = "https://mcp.vercel.com/"
# No issuer: Vercel omits RFC 9207 iss on the authorize redirect.
scopes = ["openid"]
setup_hints = [
  "Authorize uses Portunus CIMD (no Vercel client review). Docs: [vercel.com/docs/agent-resources/vercel-mcp](https://vercel.com/docs/agent-resources/vercel-mcp).",
]
