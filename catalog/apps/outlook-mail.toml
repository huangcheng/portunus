slug = "outlook-mail"
label = "Outlook Mail"
description = "Personal Outlook / Hotmail mail via Microsoft Graph (first-party portunus-graph adapter). Paste your Entra Client ID/secret at Connect."
connection = "oauth"
egress = "overseas"
popular = true
categories = ["Productivity"]
tags = ["outlook", "mail", "microsoft", "graph", "oauth"]
sort_order = 25

[spec]
url = "portunus-graph://mail"
authorize_url = "https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize"
token_url = "https://login.microsoftonline.com/consumers/oauth2/v2.0/token"
token_endpoint_auth_method = "client_secret_post"
scopes = [
  "openid",
  "profile",
  "offline_access",
  "User.Read",
  "Mail.ReadWrite",
  "Mail.Send",
]
setup_hints = [
  "Register an Entra app (personal Microsoft accounts / consumers), add delegated Mail.ReadWrite + Mail.Send + User.Read + offline_access, set the redirect URI shown at Connect, then paste **Client ID** and **client secret**. Docs: [Microsoft Graph mail](https://learn.microsoft.com/graph/api/resources/mail-api-overview).",
]
