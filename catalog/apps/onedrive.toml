slug = "onedrive"
label = "OneDrive"
description = "OneDrive files via Microsoft Graph (first-party portunus-graph adapter). Paste your Entra Client ID/secret at Connect; no rclone paste."
connection = "oauth"
egress = "overseas"
popular = true
categories = ["Storage"]
tags = ["onedrive", "microsoft", "files", "graph", "oauth"]
sort_order = 36

[spec]
url = "portunus-graph://onedrive"
authorize_url = "https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize"
token_url = "https://login.microsoftonline.com/consumers/oauth2/v2.0/token"
token_endpoint_auth_method = "client_secret_post"
scopes = [
  "openid",
  "profile",
  "offline_access",
  "User.Read",
  "Files.ReadWrite",
]
setup_hints = [
  "Register an Entra app (personal Microsoft accounts / consumers), add delegated Files.ReadWrite + User.Read + offline_access, set the redirect URI shown at Connect, then paste **Client ID** and **client secret**. Docs: [OneDrive Graph](https://learn.microsoft.com/graph/api/resources/onedrive).",
]
