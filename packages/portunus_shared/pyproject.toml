[project]
name = "portunus-shared"
version = "0.1.0"
description = "Portunus shared errors, constants, and argv grammar"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portunus_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
