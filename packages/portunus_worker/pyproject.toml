[project]
name = "portunus-worker"
version = "0.1.0"
description = "Portunus Temporal control-plane worker (OAuth refresh, probe, Connect, fleet sync)"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7.0",
]

[project.scripts]
portunus-worker = "portunus_worker.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portunus_worker"]
