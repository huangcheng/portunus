[project]
name = "portunus-skill-bridge"
version = "0.1.0"
description = "Config-driven MCP adapter: manifests → tools (http_rpc, json_cli)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
portunus-skill-bridge = "portunus_skill_bridge.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portunus_skill_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
