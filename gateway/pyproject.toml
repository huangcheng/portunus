[project]
name = "portunus-gateway"
version = "0.1.0"
description = "Portunus gateway: registry, vault, keys/grants, MCP front door"
requires-python = ">=3.12"
dependencies = [
    "portunus-shared",
    "portunus-skill-bridge",
    "cryptography>=43",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "argon2-cffi>=25.1.0",
    "uvicorn>=0.30",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "temporalio>=1.7.0",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "portunus-runner",
    "pytest>=8",
]

[tool.uv.sources]
portunus-shared = { path = "../packages/portunus_shared", editable = true }
portunus-skill-bridge = { path = "../packages/portunus_skill_bridge", editable = true }
portunus-runner = { path = "../runner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portunus_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
