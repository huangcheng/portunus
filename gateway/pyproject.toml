[project]
name = "portunus-gateway"
version = "0.1.0"
description = "Portunus gateway: registry, vault, keys/grants, MCP front door"
requires-python = ">=3.12"
dependencies = [
    "portunus-shared",
    "cryptography>=43",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "fastapi>=0.162.2",
    "mcp>=2.3.0",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx>=0.28.1",
    "portunus-runner",
    "pytest>=8",
]

[tool.uv.sources]
portunus-shared = { path = "../packages/portunus_shared", editable = true }
portunus-runner = { path = "../runner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portunus_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
